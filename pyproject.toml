[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-cuas"
version = "0.1.0"
description = "Reinforcement Learning for Cooperative Unmanned Aerial Systems"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "stable-baselines3",
    "gymnasium",
]

[project.scripts]
rl-cuas-cli = "rl_cuas.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
